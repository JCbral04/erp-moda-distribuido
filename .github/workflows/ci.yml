name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/ErpModa.sln

      - name: Compilar
        run: dotnet build backend/ErpModa.sln --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test backend/ErpModa.sln --configuration Release --no-build --no-restore --verbosity normal

  ia:
    name: Microservicio IA (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ai/requirements.txt

      - name: Verificar sintaxis de main.py
        run: python -m py_compile ai/main.py