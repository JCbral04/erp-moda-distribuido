name: DevSecOps CI/CD Pipeline

# ==============================================================================
# PIPELINE DEVSECOPS - ERP MODA DISTRIBUIDO
# ==============================================================================
# Controles de seguridad automatizados en compuertas de admisión (shift-left):
#  1. Secret Scanning: Detección de credenciales en commits con TruffleHog.
#  2. SCA .NET (NuGet): Auditoría de vulnerabilidades altas/críticas en paquetes.
#  3. SCA Python (pip): Auditoría con pip-audit en dependencias de IA.
#  4. SAST: Análisis estático de código con CodeQL (C# y Python).
#  5. Deployment Gate: Compuerta demostrativa condicionada al éxito de seguridad.
#
# REQUISITO DE CONFIGURACIÓN MANUAL EN GITHUB (PROTECCIÓN DE MAIN):
#  Este workflow ejecuta las validaciones de seguridad en cada PR. Sin embargo,
#  para que BLOQUEE efectivamente los merges a la rama protegida 'main', un
#  administrador del repositorio DEBE configurar la regla de protección de rama
#  o un Ruleset en GitHub:
#    Settings > Branches > Branch protection rules (o Repository Rulesets)
#    -> Activar "Require status checks to pass before merging"
#    -> Seleccionar como checks requeridos:
#         - Secret Scanning
#         - SCA .NET (NuGet)
#         - SCA Python (pip)
#         - Static Application Security Testing (SAST)
# ==============================================================================

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Mínimo privilegio: todo denegado por defecto; cada job declara explícitamente sus permisos
permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Escaneo de secretos en los commits del PR / push
  # ----------------------------------------------------------------------------
  # ALCANCE Y DECISIÓN DE TRUFFLEHOG:
  #  Se evalúan los commits introducidos en el PR/push (diferencial base..head)
  #  en lugar de todo el historial acumulado. Esto garantiza que las revisiones
  #  de código sean ágiles, sin bloquear a colaboradores por credenciales
  #  antiguas o falsos positivos ajenos al cambio propuesto.
  #
  # LIMITACIÓN DE --only-verified:
  #  TruffleHog únicamente reporta secretos cuyo detector cuenta con verificación
  #  activa contra el proveedor (ej. API externa de AWS, GitHub, Slack) y cuya
  #  clave responde como activa/válida. Esto elimina falsos positivos, pero NO
  #  detecta credenciales de servicios sin detector online (como strings de
  #  conexión de bases de datos internas o llaves privadas SSH/PGP no verificadas).
  # ----------------------------------------------------------------------------
  secret-detection:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          extra_args: --only-verified

  # ----------------------------------------------------------------------------
  # 2. SCA — Auditoría de dependencias NuGet (.NET)
  # ----------------------------------------------------------------------------
  dependency-scan-dotnet:
    name: SCA .NET (NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/ErpModa.sln

      - name: Audit — bloquea si hay vulnerabilidades High o Critical (incluyendo transitivas)
        run: |
          dotnet list backend/ErpModa.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -Ei "Critical|High" audit.txt; then
            echo "::error::Vulnerabilidades altas/críticas detectadas en dependencias NuGet"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # 3. SCA — Auditoría de dependencias pip (Microservicio IA)
  # ----------------------------------------------------------------------------
  dependency-scan-python:
    name: SCA Python (pip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit — bloquea si hay vulnerabilidades conocidas en dependencias pip
        run: |
          pip install pip-audit
          pip-audit -r ai/requirements.txt --strict

  # ----------------------------------------------------------------------------
  # 4. SAST con CodeQL (C# y Python)
  # ----------------------------------------------------------------------------
  sast-scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    needs: [secret-detection, dependency-scan-dotnet, dependency-scan-python]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp, python
          queries: security-and-quality
          build-mode: none   # Modo sin compilación para C# y Python

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  # ----------------------------------------------------------------------------
  # 5. Compuerta Demostrativa de Despliegue (Simulada / Pendiente)
  # ----------------------------------------------------------------------------
  # NOTA DE SEGURIDAD:
  #  Este job es un placeholder demostrativo y educativo que modela la compuerta
  #  final hacia producción. NO contiene acciones reales de despliegue ni maneja
  #  credenciales/secretos de infraestructura.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deployment Gate (Demo / Pending)
    runs-on: ubuntu-latest
    needs: sast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    environment: production
    steps:
      - name: Compuerta demostrativa (sin despliegue real)
        run: |
          echo "Todos los controles DevSecOps (Secret Scanning, SCA NuGet, SCA pip, SAST) pasaron con éxito."
          echo "Compuerta de despliegue superada (demostración). El despliegue continuo real a producción está pendiente de implementar."
