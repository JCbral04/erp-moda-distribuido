name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v7

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/ErpModa.sln

      - name: Compilar
        run: dotnet build backend/ErpModa.sln --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test backend/ErpModa.sln --configuration Release --no-build --no-restore --verbosity normal

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v7

      - name: Instalar Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas automatizadas del dashboard
        run: npm test

      - name: Compilar
        run: npm run build

  ia:
    name: Microservicio IA (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ai/requirements.txt

      - name: Verificar sintaxis de los scripts de IA
        run: python -m py_compile ai/main.py ai/deteccion.py ai/generar_video_prueba.py