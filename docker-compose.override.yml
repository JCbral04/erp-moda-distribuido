# Solo desarrollo local: docker compose up lo aplica automaticamente.
# Los puertos quedan ligados a 127.0.0.1 para no exponer servicios a la LAN.
# Produccion: docker compose -f docker-compose.yml up -d (sin este archivo,
# ningun servicio publica puerto al host).
services:
  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:5000:8080"
  db:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  ia:
    ports:
      - "127.0.0.1:8000:8000"