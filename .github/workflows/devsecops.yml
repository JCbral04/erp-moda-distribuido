name: DevSecOps CI/CD Pipeline

# ==============================================================================
# PIPELINE DEVSECOPS - ERP MODA DISTRIBUIDO
# ==============================================================================
# Controles de seguridad automatizados en compuertas de admisiÃ³n (shift-left):
#  1. Secret Scanning: DetecciÃ³n de credenciales en commits con TruffleHog.
#  2. SCA .NET (NuGet): AuditorÃ­a de vulnerabilidades altas/crÃ­ticas en paquetes.
#  3. SCA Python (pip): AuditorÃ­a con pip-audit en dependencias de IA.
#  4. SAST: AnÃ¡lisis estÃ¡tico de cÃ³digo con CodeQL (C# y Python).
#  5. Deployment Gate: Compuerta demostrativa condicionada al Ã©xito de seguridad.
#
# REQUISITO DE CONFIGURACIÃ“N MANUAL EN GITHUB (PROTECCIÃ“N DE MAIN):
#  Este workflow ejecuta las validaciones de seguridad en cada PR. Sin embargo,
#  para que BLOQUEE efectivamente los merges a la rama protegida 'main', un
#  administrador del repositorio DEBE configurar la regla de protecciÃ³n de rama
#  o un Ruleset en GitHub:
#    Settings > Branches > Branch protection rules (o Repository Rulesets)
#    -> Activar "Require status checks to pass before merging"
#    -> Seleccionar como checks requeridos:
#         - Secret Scanning
#         - SCA .NET (NuGet)
#         - SCA Python (pip)
#         - Static Application Security Testing (SAST)
# ==============================================================================

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# MÃ­nimo privilegio: todo denegado por defecto; cada job declara explÃ­citamente sus permisos
permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Escaneo de secretos en los commits del PR / push
  # ----------------------------------------------------------------------------
  # ALCANCE Y DECISIÃ“N DE TRUFFLEHOG:
  #  Se evalÃºan los commits introducidos en el PR/push (diferencial base..head)
  #  en lugar de todo el historial acumulado. Esto garantiza que las revisiones
  #  de cÃ³digo sean Ã¡giles, sin bloquear a colaboradores por credenciales
  #  antiguas o falsos positivos ajenos al cambio propuesto.
  #
  # LIMITACIÃ“N DE --only-verified:
  #  TruffleHog Ãºnicamente reporta secretos cuyo detector cuenta con verificaciÃ³n
  #  activa contra el proveedor (ej. API externa de AWS, GitHub, Slack) y cuya
  #  clave responde como activa/vÃ¡lida. Esto elimina falsos positivos, pero NO
  #  detecta credenciales de servicios sin detector online (como strings de
  #  conexiÃ³n de bases de datos internas o llaves privadas SSH/PGP no verificadas).
  # ----------------------------------------------------------------------------
  secret-detection:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          path: ./
          extra_args: --only-verified

  # ----------------------------------------------------------------------------
  # 2. SCA â€” AuditorÃ­a de dependencias NuGet (.NET)
  # ----------------------------------------------------------------------------
  dependency-scan-dotnet:
    name: SCA .NET (NuGet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/ErpModa.sln

      - name: Audit â€” bloquea si hay vulnerabilidades High o Critical (incluyendo transitivas)
        run: |
          dotnet list backend/ErpModa.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -Ei "Critical|High" audit.txt; then
            echo "::error::Vulnerabilidades altas/crÃ­ticas detectadas en dependencias NuGet"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # 3. SCA â€” AuditorÃ­a de dependencias pip (Microservicio IA)
  # ----------------------------------------------------------------------------
  dependency-scan-python:
    name: SCA Python (pip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit â€” bloquea si hay vulnerabilidades conocidas en dependencias pip
        run: |
          pip install pip-audit
          pip-audit -r ai/requirements.txt --strict

  # ----------------------------------------------------------------------------
  # 4. SAST con CodeQL (C# y Python)
  # ----------------------------------------------------------------------------
  sast-scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    needs: [secret-detection, dependency-scan-dotnet, dependency-scan-python]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout cÃ³digo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@ca3fa68ff03c08a910a220b9a7161cfe8019c1f3 # v4.39.1
        with:
          languages: csharp, python
          queries: security-and-quality
          build-mode: none   # Modo sin compilaciÃ³n para C# y Python

      - name: Ejecutar anÃ¡lisis CodeQL
        uses: github/codeql-action/analyze@d5d708ffde26b6fe811669aa7f2b4bd4b49d4c61 # v4.39.1

  # ----------------------------------------------------------------------------
  # 5. Compuerta Demostrativa de Despliegue (Simulada / Pendiente)
  # ----------------------------------------------------------------------------
  # NOTA DE SEGURIDAD:
  #  Este job es un placeholder demostrativo y educativo que modela la compuerta
  #  final hacia producciÃ³n. NO contiene acciones reales de despliegue ni maneja
  #  credenciales/secretos de infraestructura.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deployment Gate (Demo / Pending)
    runs-on: ubuntu-latest
    needs: sast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    environment: production
    steps:
      - name: Compuerta demostrativa (sin despliegue real)
        run: |
          echo "Todos los controles DevSecOps (Secret Scanning, SCA NuGet, SCA pip, SAST) pasaron con Ã©xito."
          echo "Compuerta de despliegue superada (demostraciÃ³n). El despliegue continuo real a producciÃ³n estÃ¡ pendiente de implementar."

