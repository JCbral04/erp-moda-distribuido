name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v7

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/ErpModa.sln

      - name: Compilar
        run: dotnet build backend/ErpModa.sln --configuration Release --no-restore

      - name: Ejecutar tests
        env:
          PostgreSqlConnection__String: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: dotnet test backend/ErpModa.sln --configuration Release --no-build --no-restore --verbosity normal

  ia:
    name: Microservicio IA (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ai/requirements.txt

      - name: Verificar sintaxis de los scripts de IA
        run: python -m py_compile ai/main.py ai/deteccion.py ai/generar_video_prueba.py